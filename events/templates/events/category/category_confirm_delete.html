{% extends "base.html" %}

{% block title %}Delete Category{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="bg-white rounded-xl shadow-lg p-8">

        <div class="flex items-center justify-between mb-6">

            <h1 class="text-3xl font-bold text-red-600">
                Delete Category
            </h1>

        </div>

        <div class="bg-red-50 border border-red-200 rounded-lg p-5 mb-8">

            <p class="text-gray-700">
                Are you sure you want to delete this category?
            </p>

            <div class="mt-4">

                <p class="text-lg font-semibold text-gray-900">
                    {{ category.name }}
                </p>

                {% if category.description %}
                <p class="text-gray-600 mt-2">
                    {{ category.description }}
                </p>
                {% endif %}

            </div>

        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="flex gap-4">

                <button
                    type="submit"
                    class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-lg transition">

                    Yes, Delete

                </button>

                <a
                    href="{% url 'category_list' %}"
                    class="bg-gray-500 hover:bg-gray-600 text-white font-semibold px-6 py-3 rounded-lg transition">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
