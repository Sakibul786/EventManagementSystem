{% extends "base.html" %}

{% block title %}Delete Participant{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-xl shadow-lg p-8">

    <h2 class="text-3xl font-bold text-red-600">

        Delete Participant

    </h2>

    <p class="mt-6">

        Are you sure you want to delete

        <strong>{{ participant.name }}</strong>?

    </p>

    <form method="POST" class="mt-8">

        {% csrf_token %}

        <button
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-lg">

            Delete

        </button>

        <a href="{% url 'participant_list' %}"
           class="ml-4">

            Cancel

        </a>

    </form>

</div>

{% endblock %}
