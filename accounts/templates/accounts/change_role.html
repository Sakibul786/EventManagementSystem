{% extends "base.html" %}

{% block title %}Change Role{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-xl shadow p-8">

    <h2 class="text-2xl font-bold mb-6">

        Change Role

    </h2>

    <div class="mb-6">

        <p><strong>User:</strong> {{ selected_user.username }}</p>

        <p><strong>Email:</strong> {{ selected_user.email }}</p>

    </div>

    <form method="POST">

        {% csrf_token %}

        <label class="block mb-2 font-semibold">

            Select Role

        </label>

        <select
            name="role"
            class="w-full border rounded-lg px-4 py-3 mb-6">

            {% for group in groups %}

            <option value="{{ group.name }}"
            {% if selected_user.groups.first == group %}
                selected
            {% endif %}
            >
                {{ group.name }}
            </option>

            {% endfor %}

        </select>

        <div class="flex gap-4">

            <button
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded">

                Save

            </button>

            <a
                href="{% url 'user_list' %}"
                class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
