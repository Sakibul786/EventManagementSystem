{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto">

    <div class="bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-3xl font-bold mb-8">

            Reset Password

        </h2>

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <div>

                <label class="block font-semibold mb-2">

                    New Password

                </label>

                {{ form.new_password1 }}

            </div>

            <div>

                <label class="block font-semibold mb-2">

                    Confirm Password

                </label>

                {{ form.new_password2 }}

            </div>

            <button
                type="submit"
                class="w-full bg-black text-white py-3 rounded-xl">

                Reset Password

            </button>

        </form>

    </div>

</div>

<style>

input{

    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:12px;

}

</style>

{% endblock %}
