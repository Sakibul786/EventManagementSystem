{% extends "base.html" %}

{% block title %}Delete User{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-red-600 mb-4">
        Delete User
    </h1>

    <p class="text-gray-600 mb-8">

        Are you sure you want to delete

        <strong>{{ selected_user.username }}</strong>?

    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="flex gap-4">

            <button
                type="submit"
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl">

                Delete User

            </button>

            <a href="{% url 'user_list' %}"
               class="bg-gray-300 hover:bg-gray-400 px-6 py-3 rounded-xl">

                Cancel

            </a>

        </div>

    </form>

</div>

{% endblock %}
