{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="max-w-md mx-auto mt-12 bg-white shadow-lg rounded-xl p-8">

    <h1 class="text-3xl font-bold text-center mb-6">
        Login
    </h1>

    <form method="POST">

        {% csrf_token %}

        <div class="space-y-4">

            {{ form.as_p }}

        </div>

        <button
            type="submit"
            class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg">

            Login

        </button>

    </form>

    <p class="mt-6 text-center">

        Don't have an account?

        <a
            href="{% url 'signup' %}"
            class="text-blue-600 hover:underline">

            Sign Up

        </a>

    </p>

</div>

{% endblock %}
